<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IsaFlor | Contacto</title>
    <link rel="stylesheet" href="../../Style/estilos.css">
</head>
<body>
    <header class="encabezado-principal">
        <div class="contenedor-encabezado">

            <img class="logo" src="../../imagenes/logo.webp" alt="Logo de IsaFlor">

            <nav class="menu-navegacion" aria-label="Navegación cliente">
                <ul>
                    <li><a href="inicioCliente.html">Inicio</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li><a href="contacto.html" class="activo">Contacto</a></li>
                    <li><a href="registro.html">Registro</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="contenedor-principal">
        <section class="tarjeta formulario-seccion">
            <h2>Formulario de contacto</h2>
            <form id="form-contacto" novalidate>
                <div class="campo">
                    <label for="contacto-nombre">Nombre</label>
                    <input type="text" id="contacto-nombre" name="nombre" maxlength="100" required>
                    <small class="error" data-error-for="contacto-nombre"></small>
                </div>

                <div class="campo">
                    <label for="contacto-correo">Correo electrónico</label>
                    <input type="email" id="contacto-correo" name="correo" maxlength="100">
                    <small class="error" data-error-for="contacto-correo"></small>
                </div>

                <div class="campo">
                    <label for="contacto-comentario">Comentario</label>
                    <textarea id="contacto-comentario" name="comentario" maxlength="500" required></textarea>
                    <small class="error" data-error-for="contacto-comentario"></small>
                </div>

                <button type="submit" class="boton">Enviar</button>
                <p id="mensaje-contacto" class="mensaje-exito"></p>
            </form>
        </section>
    </main>

    <script src="../../scripts/script.js"></script>
</body>
</html>
