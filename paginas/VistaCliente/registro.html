<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IsaFlor | Registro cliente</title>
    <link rel="stylesheet" href="../../Style/estilos.css">
</head>
<body>
    <header ></header>

    <main class="contenedor-principal">
        <section class="tarjeta formulario-seccion">
            <h2>Registro de usuario</h2>
            <form id="form-registro-cliente" class="form-usuario" novalidate>
                <div class="grid-formulario">
                    <div class="campo">
                        <label for="run">RUN</label>
                        <input type="text" id="run" name="run" maxlength="9" required>
                        <small class="error" data-error-for="run"></small>
                    </div>

                    <div class="campo">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" maxlength="50" required>
                        <small class="error" data-error-for="nombre"></small>
                    </div>

                    <div class="campo campo-completo">
                        <label for="apellidos">Apellidos</label>
                        <input type="text" id="apellidos" name="apellidos" maxlength="100" required>
                        <small class="error" data-error-for="apellidos"></small>
                    </div>

                    <div class="campo campo-completo">
                        <label for="correo">Correo electrónico</label>
                        <input type="email" id="correo" name="correo" maxlength="100" required>
                        <small class="error" data-error-for="correo"></small>
                    </div>

                    <div class="campo">
                        <label for="tipoUsuario">Tipo de usuario</label>
                        <select id="tipoUsuario" name="tipoUsuario" required>
                            <option value="">Seleccione</option>
                            <option value="Administrador">Administrador</option>
                            <option value="Cliente">Cliente</option>
                            <option value="Vendedor">Vendedor</option>
                        </select>
                        <small class="error" data-error-for="tipoUsuario"></small>
                    </div>

                    <div class="campo">
                        <label for="region">Región</label>
                        <select id="region" name="region" required>
                            <option value="">Seleccione una región</option>
                        </select>
                        <small class="error" data-error-for="region"></small>
                    </div>

                    <div class="campo">
                        <label for="comuna">Comuna</label>
                        <select id="comuna" name="comuna" required>
                            <option value="">Seleccione una comuna</option>
                        </select>
                        <small class="error" data-error-for="comuna"></small>
                    </div>

                    <div class="campo campo-completo">
                        <label for="direccion">Dirección</label>
                        <input type="text" id="direccion" name="direccion" maxlength="300" required>
                        <small class="error" data-error-for="direccion"></small>
                    </div>
                </div>

                <button type="submit" class="boton">Registrar usuario</button>
                <p id="mensaje-registro-cliente" class="mensaje-exito"></p>
            </form>
        </section>
    </main>

    <script src="../../scripts/script.js"></script>
</body>
</html>
