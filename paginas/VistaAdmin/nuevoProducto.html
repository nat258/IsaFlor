<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IsaFlor | Nuevo producto</title>
    <link rel="stylesheet" href="../../Style/estilos.css">
</head>
<body>
  

    <main class="contenedor-principal">
        <section class="tarjeta formulario-seccion">
            <h2>Registrar Nuevo Producto</h2>
            <form id="form-producto" novalidate>
                <div class="grid-formulario">
                    <div class="campo">
                        <label for="codigo">Código del producto *</label>
                        <input type="text" id="codigo" name="codigo" minlength="3" required>
                        <small class="error" data-error-for="codigo"></small>
                    </div>

                    <div class="campo campo-completo">
                        <label for="nombre-producto">Nombre *</label>
                        <input type="text" id="nombre-producto" name="nombre" maxlength="100" required>
                        <small class="error" data-error-for="nombre-producto"></small>
                    </div>

                    <div class="campo">
                        <label for="precio">Precio *</label>
                        <input type="number" id="precio" name="precio" min="0" step="0.01" required>
                        <small class="error" data-error-for="precio"></small>
                    </div>

                    <div class="campo">
                        <label for="stock">Stock *</label>
                        <input type="number" id="stock" name="stock" min="0" step="1" required>
                        <small class="error" data-error-for="stock"></small>
                    </div>

                    <div class="campo">
                        <label for="stock-critico">Stock Crítico *</label>
                        <input type="number" id="stock-critico" name="stockCritico" min="0" step="1" required>
                        <small class="error" data-error-for="stock-critico"></small>
                    </div>
                </div>

                <p id="alerta-stock" class="alerta-stock oculto">Alerta: el stock es menor o igual al stock crítico.</p>
                <button type="submit" class="boton">Guardar producto</button>
                <p id="mensaje-producto" class="mensaje-exito"></p>
            </form>
        </section>
    </main>

    <script src="../../scripts/script.js"></script>
</body>
</html>
