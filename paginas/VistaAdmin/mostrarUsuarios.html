<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IsaFlor | Mostrar usuarios</title>
    <link rel="stylesheet" href="../../Style/estilos.css">
</head>
<body>
    <header class="encabezado-principal">
        <div class="contenedor-encabezado">

            <img class="logo" src="../../../imagenes/logo.webp" alt="Logo de IsaFlor">

            <nav class="menu-navegacion" aria-label="Navegación administrador">
                <ul>
                    <li><a href="inicioAdmin.html">Inicio</a></li>
                    <li><a href="mostrarUsuarios.html" class="activo">Usuarios</a></li>
                    <li><a href="nuevoUsuario.html">Nuevo usuario</a></li>
                    <li><a href="registroUsuario.html">Registro usuario</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="contenedor-principal">
        <section class="tarjeta">
            <h2>Listado de usuarios</h2>
            <p>Usuarios rregistrados en IsaFlor</p>

            <div class="tabla-responsiva">
                <table class="tabla-usuarios">
                    <thead>
                        <tr>
                            <th>Run</th>
                            <th>Nombre</th>
                            <th>Apellidos</th>
                            <th>Correo</th>
                            <th>Tipo usuario</th>
                            <th>Region</th>
                            <th>Comuna</th>
                            <th>Direccion</th>
                        </tr>
                    </thead>
                    <tbody id="lista-usuarios"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="../../scripts/script.js"></script>
</body>
</html>
